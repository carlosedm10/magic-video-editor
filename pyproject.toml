[project]
name = "magic-video-editor"
version = "0.8.4"
description = "Local-first AI video editor: whisper + ollama decide, ffmpeg cuts."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywebview>=5.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "opencv-python-headless>=4.10,<5",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "pydantic>=2.8",
    "mlx-whisper>=0.4; platform_machine == 'arm64'",
    "imageio-ffmpeg>=0.5",
    "pydantic-ai-slim[openai]>=2.17.0",
    "noisereduce>=3.0.3",
    "pyloudnorm>=0.2.0",
    "soundfile>=0.14.0",
    "psutil>=7.2.2",
    "python-multipart>=0.0.32",
    "resemblyzer>=0.1.4",
    "setuptools<81",
    "static-ffmpeg>=3.0",
    "deepfilternet>=0.5.6",
    "torch==2.2.2",
    "torchaudio==2.2.2",
]

[project.scripts]
mve = "magic_video_editor.app:main"
mve-server = "magic_video_editor.server:main"

[tool.uv]
# resemblyzer 0.1.4 unconditionally requires the obsolete `typing` backport,
# which breaks PyInstaller. Override it so it never installs on our pythons.
override-dependencies = ["typing ; python_version < '3.5'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["magic_video_editor"]
