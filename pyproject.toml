[project]
name = "cutroom"
version = "0.1.0"
description = "Local-first AI video editor: whisper + ollama decide, ffmpeg cuts."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywebview>=5.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "pydantic>=2.8",
    "mlx-whisper>=0.4; platform_machine == 'arm64'",
]

[project.scripts]
cutroom = "cutroom.app:main"
cutroom-server = "cutroom.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cutroom"]
